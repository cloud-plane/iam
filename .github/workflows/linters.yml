---
name: Linters

permissions:
  contents: read

on:
  pull_request:
    branches: ["main" ]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'merge_group' && github.run_id || github.event.pull_request.number || github.sha }}

env:
  CARGO_TERM_COLOR: always
  rust_min: 1.96.0

jobs:
  clippy:
    name: Run clippy on the minimum supported toolchain
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:

      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # `storage-crypto-tpm`'s `tss-esapi` needs `libtss2-dev` +
          # `pkg-config` to compile (see the matching step in ci.yml); no
          # TPM device is required.
          sudo apt-get install -y protobuf-compiler libtss2-dev pkg-config

      - name: Install Rust ${{ env.rust_min }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.rust_min }}
          components: rustfmt, clippy

      - name: Install cargo-binstall
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall

      - name: Install required cargo
        run: cargo binstall clippy-sarif sarif-fmt --force

      - name: Run rustfmt
        run: cargo fmt -- --check

      - name: Run rust-clippy
        run: |
          set -o pipefail
          cargo clippy \
          --lib --tests --all-features \
          --message-format=json | ${CARGO_HOME}/bin/clippy-sarif | tee rust-clippy-results.sarif | ${CARGO_HOME}/bin/sarif-fmt

      - name: Upload analysis results to GitHub
        uses: github/codeql-action/upload-sarif@v4
        if: github.event_name != 'merge_group'
        with:
          sarif_file: rust-clippy-results.sarif
          wait-for-processing: true

  typos:
    name: Spell Check with Typos
    runs-on: ubuntu-latest
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@v2
      with:
        egress-policy: audit

    - name: Checkout Actions Repository
      uses: actions/checkout@v7

    - name: Check spelling of file.txt
      uses: crate-ci/typos@v1
      with:
        config: typos.toml

  no-dev-mode:
    name: Check deployment files for dev-mode flags
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check for dev-mode flags
        run: tools/check_no_dev_mode.sh

  opa:
    name: Check OPA policy formatting
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup OPA
        uses: open-policy-agent/setup-opa@v2
        with:
          version: 1.6.0

      - name: Test OPA policies
        run: opa fmt policy --check-result

  committed:
    name: Lint Commits
    runs-on: ubuntu-latest
    steps:

    - name: Harden Runner
      uses: step-security/harden-runner@v2
      with:
        egress-policy: audit

    - name: Checkout Actions Repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Lint Commits
      uses: crate-ci/committed@v1.1.7
      if: github.event_name != 'merge_group'
      with:
        # committed's default range (HEAD~..HEAD^2) assumes a 2-parent PR merge
        # commit, which doesn't exist on the merge queue's single-commit ref.
        commits: ${{ github.event_name == 'merge_group' && 'HEAD~1..HEAD' || 'HEAD~..HEAD^2' }}

  actions-lock:
    name: Verify Actions Lockfile
    runs-on: ubuntu-latest
    steps:

    - name: Harden Runner
      uses: step-security/harden-runner@v2
      with:
        egress-policy: audit

    - name: Checkout Actions Repository
      uses: actions/checkout@v7

    - name: Install gh-actions-lock extension
      run: gh extension install github/gh-actions-lock --pin v0.5.1

    - name: Verify Actions Lockfile
      # Fails if .github/workflows/actions.lock is out of sync with the
      # workflows or pins a commit the runner would reject (moved or
      # unreachable ref, repository identity change).
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh actions-lock --verify
