name: Security audit

permissions:
  contents: read

on:
  schedule:
    - cron: '0 0 * * 6'
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - '.github/workflows/audit.yml'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
  pull_request:
    paths:
      - '.github/workflows/audit.yml'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'supply-chain/**'

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  CLICOLOR: 1

jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    #strategy:
    #  matrix:
    #    checks:
    #      - advisories
    #      - bans licenses sources

    # Prevent sudden announcement of a new advisory from failing ci:
    continue-on-error: ${{ matrix.checks == 'advisories' }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@v7

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          rust-version: stable

  cargo-vet:
    name: Supply-chain audits (cargo-vet)
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@v7

      - name: Install cargo-vet
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-vet@0.10.2

      - name: Run cargo vet
        run: cargo vet --locked
