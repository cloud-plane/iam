syntax = "proto3";

package keystone.api;

import "google/protobuf/empty.proto";
import "google/protobuf/wrappers.proto";
import "storage_types.proto";

// StorageService provides the key-value store API operations.
service StorageService {
  // Write the command.
  rpc Command(keystone.api.CommandRequest) returns (keystone.api.Response) {}
  // Forwarded read from follower to leader.
  rpc ForwardedGet(keystone.api.ForwardedGetRequest) returns (keystone.api.ForwardedGetResponse) {}
  // Forwarded prefix scan from follower to leader.
  rpc ForwardedPrefix(keystone.api.ForwardedPrefixRequest) returns (keystone.api.ForwardedPrefixResponse) {}
  // Forwarded prefix-index scan from follower to leader.
  rpc ForwardedPrefixIndex(keystone.api.ForwardedPrefixIndexRequest) returns (keystone.api.ForwardedPrefixIndexResponse) {}
  // Revisions of keyspaces on the leader, forwarded from a follower.
  rpc ForwardedKeyspaceRevisions(keystone.api.ForwardedKeyspaceRevisionsRequest) returns (keystone.api.ForwardedKeyspaceRevisionsResponse) {}
  // Per-keyspace watermarks at a fresh linearizable read index (ADR 0048).
  rpc ReadWatermark(keystone.api.ReadWatermarkRequest) returns (keystone.api.ReadWatermarkResponse) {}
  // A node reports a locally-triggered quarantine so the leader can commit it.
  rpc ReportQuarantine(keystone.api.ReportQuarantineRequest) returns (google.protobuf.Empty) {}
}
