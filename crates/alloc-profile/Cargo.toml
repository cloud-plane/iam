[package]
name = "openstack-keystone-alloc-profile"
description = "Per-thread allocation counting for allocation-regression tests"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

# The workspace forbids `unsafe_code`, and implementing `GlobalAlloc` is
# unsafe by definition. All the unsafe code of the workspace's allocation
# tests is confined to this one small crate so the crates under test can keep
# the forbid. Every other workspace lint stays in force.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
enum_glob_use = "deny"
expect_used = "deny"
print_stdout = "deny"
unwrap_used = "deny"
doc_paragraphs_missing_punctuation = "warn"
