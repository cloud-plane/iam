[package]
name = "openstack-keystone-core"
description = "OpenStack Keystone service"
version = "0.1.1"
rust-version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
arc-swap.workspace = true
argon2.workspace = true
async-trait.workspace = true
cadf = { workspace = true }
axum = { workspace = true, default-features = false, features = ["json", "original-uri", "tokio"], optional = true }
base64.workspace = true
chrono = { workspace = true, default-features = false }
crc32fast.workspace = true
dashmap.workspace = true
data-encoding.workspace = true
derive_builder.workspace = true
erased-serde.workspace = true
eyre.workspace = true
futures-util.workspace = true
governor.workspace = true
hmac.workspace = true
http.workspace = true
inventory.workspace = true
ipnet.workspace = true
jsonwebtoken.workspace = true
mockall = { workspace = true, optional = true }
openstack-keystone-api-types = { workspace = true, optional = true }
openstack-keystone-auth-plugin-core.workspace = true
# Only used by the end-to-end wasm plugin tests (`wasm_plugins` feature).
openstack-keystone-auth-plugin-runtime = { workspace = true, optional = true }
openstack-keystone-core-types.workspace = true
openstack-keystone-config.workspace = true
openstack-keystone-jwt-crypto.workspace = true
openstack-keystone-key-repository.workspace = true
openstack-keystone-local-emergency-store.workspace = true
openstack-keystone-storage-api.workspace = true
openstack-keystone-telemetry.workspace = true
oslo-config.workspace = true
p256 = { workspace = true, features = ["ecdsa", "pkcs8", "pem"] }
percent-encoding.workspace = true
rand.workspace = true
rsa.workspace = true
regex.workspace = true
regex-syntax.workspace = true
sea-orm.workspace = true
sea-orm-migration.workspace = true
secrecy = { workspace = true, features = ["serde"] }
sha1.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_urlencoded.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio = { workspace = true, default-features = false, features = ["net", "rt-multi-thread", "sync"] }
tracing.workspace = true
url = { workspace = true, features = ["serde"] }
uuid = { workspace = true, features = ["v4"] }
validator.workspace = true

[dev-dependencies]
axum = { workspace = true, default-features = false, features = ["json", "original-uri", "tokio"] }
cadf = { workspace = true, features = ["testing"] }
config = { workspace = true }
mockall.workspace = true
openstack-keystone-alloc-profile.workspace = true
openstack-keystone-api-types = { workspace = true, features = ["builder", "conv"] }
openstack-keystone-telemetry = { workspace = true, features = ["golden"] }
openstack-keystone-core-types = { workspace = true, features = ["mock"] }
proptest.workspace = true
rstest.workspace = true
sea-orm = { workspace = true, features = ["sqlx-sqlite", "runtime-tokio"] }
tempfile.workspace = true
temp-env.workspace = true
tokio = { workspace = true, features = ["process"] }
tracing-test = { workspace = true, features = ["no-env-filter"] }
url.workspace = true

[features]
default = []
api = ["openstack-keystone-api-types/builder", "dep:axum", "openstack-keystone-api-types/conv"]
bench_internals = []
# Enables the end-to-end tests that load real wasm plugins (pulls in
# extism/wasmtime).
wasm_plugins = ["dep:openstack-keystone-auth-plugin-runtime", "openstack-keystone-auth-plugin-runtime/extism"]
mock = ["dep:mockall", "openstack-keystone-core-types/mock", "cadf/testing"]

[lints]
workspace = true
